    <circle cx="157" cy="152" r="18" fill="#fff"/>
  </g>
  <text x="720" y="495" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="800" letter-spacing="-4" text-anchor="middle">Fleeterbase</text>
