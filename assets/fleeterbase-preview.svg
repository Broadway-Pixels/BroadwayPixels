<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">Fleeterbase</title>
  <desc id="description">Fleeterbase car mark on a dark navy and teal fleet operations background</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1340" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061a32"/>
      <stop offset="0.55" stop-color="#0b3150"/>
      <stop offset="1" stop-color="#087b7b"/>
    </linearGradient>
    <linearGradient id="road" x1="420" y1="650" x2="1040" y2="650" gradientUnits="userSpaceOnUse">
