      <stop offset="0.5" stop-color="#8df3df" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#35c7bb" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
